# Kampagnen-Radar: open clipping campaigns on Content Rewards that fit our accounts -> campaigns/latest.md + latest.json.
# No login, no API key, no Claude quota. Config: plan/kampagnen.json
name: kampagnen
on:
  push:
    branches: [main]
    paths: ["plan/kampagnen.json", "pipeline/kampagnen/**", ".github/workflows/kampagnen.yml"]
  schedule:
    - cron: "27 5,11,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kampagnen
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            plan
            pipeline/kampagnen
            campaigns
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and publish
        run: |
          pip install -q curl_cffi
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          python3 pipeline/kampagnen/kampagnen.py selftest
          for i in 1 2 3 4; do
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main || { sleep 5; continue; }
            python3 pipeline/kampagnen/kampagnen.py run . || exit 0
            git add -A campaigns; git diff --cached --quiet && break
            git commit -q -m "kampagnen: update" && git push -q origin HEAD:main && { echo PUBLISHED; break; }
            sleep 8
          done
