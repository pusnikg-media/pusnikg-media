# Kampagnen-Radar: open clipping campaigns on Content Rewards that fit our accounts -> campaigns/latest.md + latest.json.
# No login, no API key, no Claude quota. Config: plan/kampagnen.json
name: kampagnen
on:
  push:
    branches: [main]
    paths: ["plan/kampagnen.json", "pipeline/kampagnen/**", ".github/workflows/kampagnen.yml"]
  schedule:
    - cron: "27 5,11,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kampagnen
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            plan
            pipeline/kampagnen
            campaigns
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and publish
        run: |
          pip install -q curl_cffi
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          python3 pipeline/kampagnen/kampagnen.py selftest
          # scrape ONCE (a run takes 3 min), then only the publish step is retried (v16.11. night: the old loop re-scraped on every push collision, 11.7 of 15 min)
          python3 pipeline/kampagnen/kampagnen.py run . || exit 0
          git add -A campaigns; git diff --cached --quiet && { echo "nothing new"; exit 0; }
          OUT=/home/runner/out_campaigns; rm -rf "$OUT"; mkdir -p "$OUT"; cp -r campaigns/. "$OUT/"
          for i in 1 2 3 4 5 6; do  # publish on top of the newest main (many bots push); the folder is replaced as a whole, no rebase
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main || { sleep 5; continue; }
            rm -rf campaigns; mkdir -p campaigns; cp -r "$OUT/." campaigns/
            git add -A campaigns; git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -q -m "kampagnen: update" && git push -q origin HEAD:main && { echo PUBLISHED; exit 0; }
            echo "push retry $i"; sleep 8
          done
          echo "::error::kampagnen: push failed after 6 tries"; exit 1
