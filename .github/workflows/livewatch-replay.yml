# Livewatch VOD mode (16.11.2026): plays a window of a past Twitch VOD through the live detection (audio loudness + chat replay).
# Manual only. Inputs: vod (https://www.twitch.tv/videos/<id>), start (second), minutes, min_chat (optional). Clips -> clips/live-<channel>/ + inbox.json
# The channel name/layout comes from plan/livewatch.json (first channel), enabled is NOT required.
name: livewatch-replay
on:
  workflow_dispatch:
    inputs:
      vod: {description: "Twitch VOD url", required: true}
      start: {description: "start second in the VOD", required: true, default: "3600"}
      minutes: {description: "minutes to play", required: true, default: "40"}
      min_chat: {description: "chat burst ratio (empty = profile of the channel)", required: false, default: ""}
      compare: {description: "also run the OLD settings on the same recording (QA pictures only, dir live-<name>-old)", required: false, default: "false"}
permissions:
  contents: write
concurrency:
  group: livewatch
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: clipfabrik-whisper-small-v3
      - name: Install tools
        timeout-minutes: 20
        run: |
          bash pipeline/install_tools.sh || exit 1
          pip install -q numpy scipy pillow faster-whisper yt-dlp curl_cffi "opencv-python-headless<5"
      - name: Replay
        env:
          VOD: ${{ inputs.vod }}
          START: ${{ inputs.start }}
          MINUTES: ${{ inputs.minutes }}
          MINCHAT: ${{ inputs.min_chat }}
          COMPARE: ${{ inputs.compare }}
        run: |
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          python3 -u pipeline/clipfabrik/livewatch.py replay "$VOD" "$START" "$MINUTES" . "$MINCHAT" $([ "$COMPARE" = "true" ] && echo compare)
