# Livewatch v0 (prototype): "almost live" clipping. While a channel from plan/livewatch.json is live, this runner records it,
# spots loud stand-out moments and publishes a finished 9:16 clip to clips/live-<channel>/ a few minutes later (+ inbox.json).
# Switched off by default: plan/livewatch.json {"enabled": false}. Details: pipeline/clipfabrik/livewatch.py
name: livewatch
on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      urls: {description: "TEST (ignores enabled): comma-separated channel urls, first live one is recorded", required: false, default: ""}
      minutes: {description: "TEST: max minutes (default 35)", required: false, default: "35"}
      profile: {description: "TEST: irl or gaming", required: false, default: "gaming"}
permissions:
  contents: write
concurrency:
  group: livewatch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Enabled?
        id: c
        env:
          IN_URLS: ${{ inputs.urls }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/plan/livewatch.json" -o lw.json || echo '{}' > lw.json
          echo "go=$(python3 -c 'import json;c=json.load(open("lw.json"));import datetime as D;u=c.get("until");ok=c.get("enabled") and c.get("channels") and (not u or D.datetime.now(D.timezone.utc)<D.datetime.fromisoformat(u.replace("Z","+00:00")));print("run" if ok else "skip")')" >> "$GITHUB_OUTPUT"
          if [ -n "$IN_URLS" ]; then echo "go=run" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.c.outputs.go == 'run'
        with:
          ref: main
      - name: Test override (manual run with urls only; nothing is committed from this file)
        if: inputs.urls != ''
        env:
          IN_URLS: ${{ inputs.urls }}
          IN_MIN: ${{ inputs.minutes }}
          IN_PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import json, os, re
          chans = []
          for u in os.environ["IN_URLS"].split(","):
              u = u.strip()
              m = re.fullmatch(r"https://(www\.)?(twitch\.tv|kick\.com)/([A-Za-z0-9_]+)", u)
              if not m: raise SystemExit("bad url: " + u)
              prof = os.environ.get("IN_PROFILE", "gaming")
              chans.append({"name": m.group(3), "url": u, "height": 720, "profile": "irl" if prof == "irl" else "gaming", "max_clips": 3})
          mins = max(5, min(int(re.sub(r"\D", "", os.environ.get("IN_MIN", "35")) or 35), 120))
          json.dump({"enabled": True, "max_minutes": mins, "channels": chans}, open("plan/livewatch.json", "w"))
          print("TEST config:", chans, mins)
          PY
          git update-index --skip-worktree plan/livewatch.json  # keeps 'git pull --rebase' in livewatch.py working
      - uses: actions/setup-python@v5
        if: steps.c.outputs.go == 'run'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.c.outputs.go == 'run'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: clipfabrik-whisper-small-v3
      - name: Install tools
        if: steps.c.outputs.go == 'run'
        timeout-minutes: 20
        run: |
          bash pipeline/install_tools.sh || exit 1
          pip install -q numpy scipy pillow faster-whisper yt-dlp curl_cffi "opencv-python-headless<5"
      - name: Watch
        if: steps.c.outputs.go == 'run'
        run: |
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          python3 -u pipeline/clipfabrik/livewatch.py watch .
