# Pusnik G render farm (free GitHub runner, public repo).
# The scheduled producer opens an issue titled "render <date>" whose body contains the job spec in a ```json block
# (format: pipeline/gh_render.py). This workflow renders the short, commits it to shorts/ and comments
# RENDER_OK + the raw URLs (or RENDER_FAIL + the reason) on the issue, then closes it.
# Why: scheduled Claude sessions are not allowed to run downloaded code - the runner does it instead.
name: render
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      spec_path:
        description: "repo path of a spec.json to render (manual rerun)"
        required: true
permissions:
  contents: write
  issues: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'render ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KOKORO_DIR: /home/runner/tts
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read job spec
        env:
          BODY: ${{ github.event.issue.body }}
          SPEC_PATH: ${{ github.event.inputs.spec_path }}
        run: |
          mkdir -p /home/runner/work_short
          if [ -n "$SPEC_PATH" ]; then cp "$SPEC_PATH" /home/runner/work_short/spec.json; else
            python3 - <<'EOF'
          import json, os, re
          b = os.environ.get("BODY", "")
          m = re.search(r"```(?:json)?\s*(\{.*\})\s*```", b, re.S) or re.search(r"(\{.*\})", b, re.S)
          spec = json.loads(m.group(1))
          json.dump(spec, open("/home/runner/work_short/spec.json", "w"), indent=1, ensure_ascii=False)
          print("spec ok:", spec.get("date"), "day", spec.get("day"), len(spec.get("script", [])), "lines")
          EOF
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/render.yml
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/tts
            ~/.cache/huggingface
          key: models-kokoro1-whisperbase-v1
      - name: Install tools
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q espeak-ng ffmpeg >/dev/null
          pip install -q onnxruntime numpy scipy pillow faster-whisper
          mkdir -p "$KOKORO_DIR"
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s "$KOKORO_DIR/voices-v1.0.bin" ] || curl -sSL -o "$KOKORO_DIR/voices-v1.0.bin" $B/voices-v1.0.bin
          [ -s "$KOKORO_DIR/kokoro-v1.0.onnx" ] || curl -sSL -o "$KOKORO_DIR/kokoro-v1.0.onnx" $B/kokoro-v1.0.onnx
          espeak-ng --version && ffmpeg -version | head -1
      - name: Render
        id: render
        run: python3 pipeline/gh_render.py /home/runner/work_short/spec.json /home/runner/work_short
        continue-on-error: true
      - name: Commit, comment, close
        if: always()
        run: |
          python3 - <<'EOF' > /home/runner/comment.md
          import json, os, shutil, subprocess
          W = "/home/runner/work_short"
          try: r = json.load(open(f"{W}/result.json"))
          except Exception: r = {"ok": False, "error": "no result.json (render step crashed - see Actions log)", "log": []}
          raw = "https://raw.githubusercontent.com/" + os.environ["GITHUB_REPOSITORY"] + "/main/"
          urls = {}
          os.makedirs("shorts/qa", exist_ok=True)
          if r.get("video") and os.path.exists(r["video"]):
              dst = "shorts/" + os.path.basename(r["video"]); shutil.copy(r["video"], dst); urls["video"] = raw + dst
          for p in r.get("pngs", []):
              dst = "shorts/qa/" + os.path.basename(p); shutil.copy(p, dst); urls.setdefault("pngs", []).append(raw + dst)
          r["urls"] = urls
          head = "RENDER_OK" if r.get("ok") else "RENDER_FAIL"
          print(head)
          print()
          if urls.get("video"): print("Video:", urls["video"])
          for u in urls.get("pngs", []): print("QA frame:", u)
          if not r.get("ok"): print("Error:", r.get("error", "?"))
          print()
          print("```json")
          print(json.dumps({k: v for k, v in r.items() if k != "log"}, indent=1, ensure_ascii=False)[:6000])
          print("```")
          print("<details><summary>log</summary>\n\n```\n" + "\n".join(r.get("log", []))[-5000:] + "\n```\n</details>")
          EOF
          cat /home/runner/comment.md | head -20
          if [ -n "$(git status --porcelain shorts)" ]; then
            git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
            git add shorts && git commit -q -m "short: ${{ github.event.issue.title || github.event.inputs.spec_path }}"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file /home/runner/comment.md
            gh issue close ${{ github.event.issue.number }}
          fi
          grep -q '^RENDER_OK' /home/runner/comment.md
