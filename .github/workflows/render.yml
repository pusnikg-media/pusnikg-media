# Pusnik G render farm (free GitHub runner, public repo).
# Scheduled Claude sessions may not run downloaded code - this runner does the rendering instead.
# Jobs: jobs/<name>.json in the repo (format: pipeline/gh_render.py), optionally job-*.json in the public
# Drive folder (vars.DRIVE_FOLDER). Result per job: shorts/<name>.mp4, shorts/qa/<name>_qa_*.png and
# shorts/<name>.json ({"ok", "urls", "error", ...}); the producer polls the raw URL of that json.
name: render
on:
  push:
    branches: [main]
    paths: ["jobs/**", ".github/workflows/render.yml", "pipeline/**"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KOKORO_DIR: /home/runner/tts
      DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect pending jobs
        id: collect
        run: |
          python3 pipeline/gh_jobs.py > /home/runner/pending.json
          cat /home/runner/pending.json
          echo "n=$(python3 -c 'import json;print(len(json.load(open("/home/runner/pending.json"))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.n != '0'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.collect.outputs.n != '0'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.collect.outputs.n != '0'
        with:
          path: |
            /home/runner/tts
            ~/.cache/huggingface
            ~/.cache/pip
          key: models-kokoro1-whisperbase-v2
      - name: Install tools
        if: steps.collect.outputs.n != '0'
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q espeak-ng ffmpeg >/dev/null
          pip install -q onnxruntime numpy scipy pillow faster-whisper
          mkdir -p "$KOKORO_DIR"
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          get() {  # file url min_bytes: re-download until the size is plausible (a cut-off download broke run 1)
            for i in 1 2 3; do
              [ -f "$1" ] && [ "$(stat -c%s "$1")" -ge "$3" ] && return 0
              rm -f "$1"; curl -fsSL --retry 3 -o "$1" "$2" || true
            done
            [ -f "$1" ] && [ "$(stat -c%s "$1")" -ge "$3" ] || { echo "MODEL DOWNLOAD FAIL $2"; ls -la "$KOKORO_DIR"; exit 1; }
          }
          get "$KOKORO_DIR/voices-v1.0.bin" $B/voices-v1.0.bin 20000000
          get "$KOKORO_DIR/kokoro-v1.0.onnx" $B/kokoro-v1.0.onnx 300000000
          python3 -c "import onnxruntime as o;o.InferenceSession('$KOKORO_DIR/kokoro-v1.0.onnx',providers=['CPUExecutionProvider']);print('KOKORO_OK')" || { rm -f "$KOKORO_DIR/kokoro-v1.0.onnx"; exit 1; }
          ls -la "$KOKORO_DIR"
          espeak-ng --version && ffmpeg -version | head -1
      - name: Render, publish results
        if: steps.collect.outputs.n != '0'
        run: |
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          for spec in $(python3 -c 'import json;print(" ".join(json.load(open("/home/runner/pending.json"))))'); do
            name=$(basename "$spec" .json); W="/home/runner/work_$name"
            echo "::group::render $name"
            python3 pipeline/gh_render.py "$spec" "$W" || true
            echo "::endgroup::"
            python3 - "$W" "$name" "$RAW" <<'EOF'
          import json, os, shutil, sys
          W, name, raw = sys.argv[1:4]
          try: r = json.load(open(f"{W}/result.json"))
          except Exception: r = {"ok": False, "error": "no result.json - renderer crashed, see Actions log", "log": []}
          os.makedirs("shorts/qa", exist_ok=True); urls = {}
          if r.get("video") and os.path.exists(r["video"]):
              shutil.copy(r["video"], f"shorts/{name}.mp4"); urls["video"] = f"{raw}/shorts/{name}.mp4"
          for p in r.get("pngs", []):
              dst = "shorts/qa/" + os.path.basename(p); shutil.copy(p, dst); urls.setdefault("pngs", []).append(f"{raw}/{dst}")
          r["urls"] = urls; r["name"] = name
          try: r["attempts"] = json.load(open(f"/home/runner/jobs_in/{name}.json")).get("_attempt", 1)
          except Exception: r["attempts"] = 1
          r.pop("video", None); r.pop("pngs", None)
          json.dump(r, open(f"shorts/{name}.json", "w"), indent=1, ensure_ascii=False)
          print(("RENDER_OK " if r.get("ok") else "RENDER_FAIL ") + name + " " + str(r.get("error", "")))
          EOF
            git add shorts
            git commit -q -m "short: $name" || true
            for i in 1 2 3 4; do git fetch -q --depth=20 origin main && git rebase -q origin/main && git push -q origin HEAD:main && break; sleep 7; done
          done
