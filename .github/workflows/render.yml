# Pusnik G render farm (free GitHub runner, public repo).
# Scheduled Claude sessions may not run downloaded code - this runner does the rendering instead.
# Jobs: jobs/<name>.json in the repo (format: pipeline/gh_render.py), optionally job-*.json in the public
# Drive folder (vars.DRIVE_FOLDER). Result per job: shorts/<name>.mp4, shorts/qa/<name>_qa_*.png and
# shorts/<name>.json ({"ok", "urls", "error", ...}); the producer polls the raw URL of that json.
name: render
on:
  push:
    branches: [main]
    paths: ["jobs/**", ".github/workflows/render.yml", "pipeline/**"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KOKORO_DIR: /home/runner/tts
      DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || '1sZgGx8xmJ5OX5UcGUhZn9u_UzenRGYwF' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # always the newest state (a push run would otherwise see an old commit and redo finished shorts)
      - name: Collect pending jobs
        id: collect
        run: |
          python3 pipeline/gh_jobs.py > /home/runner/pending.json
          cat /home/runner/pending.json
          echo "n=$(python3 -c 'import json;print(len(json.load(open("/home/runner/pending.json"))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.n != '0'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.collect.outputs.n != '0'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.collect.outputs.n != '0'
        with:
          path: |
            /home/runner/tts
            ~/.cache/huggingface
            ~/.cache/pip
          key: models-kokoro1-whisperbase-v2
      - name: Install tools
        if: steps.collect.outputs.n != '0'
        timeout-minutes: 20
        run: |
          # 11.11.: ubuntu-latest moved to Ubuntu 26 ("resolute"), whose apt mirrors were unreachable -> apt hung 60 min.
          # Pinned ubuntu-24.04, hard timeouts, and a static ffmpeg from GitHub as fallback.
          export DEBIAN_FRONTEND=noninteractive
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          ff_static() {
            command -v ffmpeg >/dev/null && return 0
            echo "apt had no ffmpeg - using static build"
            curl -fsSL --retry 3 --max-time 300 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo tar -xJf /tmp/ff.tar.xz -C /opt && sudo ln -sf /opt/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          }
          for i in 1 2 3; do  # espeak-ng has no static fallback: retry apt, but never hang
            timeout 240 sudo -E apt-get $A update -q >/dev/null || true
            timeout 300 sudo -E apt-get $A install -y -q espeak-ng ffmpeg >/dev/null && break
            echo "apt retry $i"; sleep 20
          done
          command -v espeak-ng >/dev/null || { echo "ESPEAK INSTALL FAIL"; exit 1; }
          ff_static
          pip install -q onnxruntime numpy scipy pillow faster-whisper
          mkdir -p "$KOKORO_DIR"
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          get() {  # file url min_bytes: re-download until the size is plausible (a cut-off download broke run 1)
            for i in 1 2 3; do
              [ -f "$1" ] && [ "$(stat -c%s "$1")" -ge "$3" ] && return 0
              rm -f "$1"; curl -fsSL --retry 3 -o "$1" "$2" || true
            done
            [ -f "$1" ] && [ "$(stat -c%s "$1")" -ge "$3" ] || { echo "MODEL DOWNLOAD FAIL $2"; ls -la "$KOKORO_DIR"; exit 1; }
          }
          get "$KOKORO_DIR/voices-v1.0.bin" $B/voices-v1.0.bin 20000000
          get "$KOKORO_DIR/kokoro-v1.0.onnx" $B/kokoro-v1.0.onnx 300000000
          python3 -c "import onnxruntime as o;o.InferenceSession('$KOKORO_DIR/kokoro-v1.0.onnx',providers=['CPUExecutionProvider']);print('KOKORO_OK')" || { rm -f "$KOKORO_DIR/kokoro-v1.0.onnx"; exit 1; }
          ls -la "$KOKORO_DIR"
          espeak-ng --version && ffmpeg -version | head -1
      - name: Render, publish results
        if: steps.collect.outputs.n != '0'
        run: |
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          done_ok() { git fetch -q --depth=1 origin main && git show "origin/main:shorts/$1.json" 2>/dev/null | python3 -c "import json,sys;sys.exit(0 if json.load(sys.stdin).get('ok') else 1)"; }
          for spec in $(python3 -c 'import json;print(" ".join(json.load(open("/home/runner/pending.json"))))'); do
            name=$(basename "$spec" .json); W="/home/runner/work_$name"; O="/home/runner/out_$name"
            if done_ok "$name"; then echo "skip $name (already rendered by another run)"; continue; fi
            echo "::group::render $name"
            python3 pipeline/gh_render.py "$spec" "$W" || true
            echo "::endgroup::"
            python3 - "$W" "$name" "$RAW" "$O" <<'EOF'
          import json, os, shutil, sys
          W, name, raw, O = sys.argv[1:5]
          try: r = json.load(open(f"{W}/result.json"))
          except Exception: r = {"ok": False, "error": "no result.json - renderer crashed, see Actions log", "log": []}
          os.makedirs(f"{O}/shorts/qa", exist_ok=True); urls = {}
          if r.get("video") and os.path.exists(r["video"]):
              shutil.copy(r["video"], f"{O}/shorts/{name}.mp4"); urls["video"] = f"{raw}/shorts/{name}.mp4"
          for p in r.get("pngs", []):
              b = os.path.basename(p); shutil.copy(p, f"{O}/shorts/qa/{b}"); urls.setdefault("pngs", []).append(f"{raw}/shorts/qa/{b}")
          r["urls"] = urls; r["name"] = name
          try: r["attempts"] = json.load(open(f"/home/runner/jobs_in/{name}.json")).get("_attempt", 1)
          except Exception: r["attempts"] = 1
          r.pop("video", None); r.pop("pngs", None)
          json.dump(r, open(f"{O}/shorts/{name}.json", "w"), indent=1, ensure_ascii=False)
          print(("RENDER_OK " if r.get("ok") else "RENDER_FAIL ") + name + " " + str(r.get("error", "")))
          EOF
            for i in 1 2 3 4 5; do  # publish on top of the newest main; never rebase (no conflicts possible)
              git fetch -q --depth=1 origin main && git reset -q --hard origin/main || { sleep 5; continue; }
              if done_ok "$name"; then echo "skip publish $name (already there)"; break; fi
              cp -r "$O/shorts/." shorts/ && git add shorts && git commit -q -m "short: $name" && git push -q origin HEAD:main && { echo "PUBLISHED $name"; break; }
              echo "push retry $i"; sleep 8
            done
          done
