# Zahlen-Sammler: public view counts of our own posts (YouTube feed, TikTok profile) -> stats/latest.json, stats/latest.md,
# stats/history.json. No login, no API key, no credits. Agents read stats/latest.md instead of Metricool/Zapier/vidIQ.
name: stats
on:
  push:
    branches: [main]
    paths: ["plan/stats.json", "pipeline/stats/**", ".github/workflows/stats.yml"]
  schedule:
    - cron: "17 5,11,16,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            plan
            pipeline/stats
            stats
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and publish
        run: |
          pip install -q yt-dlp curl_cffi
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          python3 pipeline/stats/stats.py selftest
          for i in 1 2 3 4; do
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main || { sleep 5; continue; }
            python3 pipeline/stats/stats.py run . || exit 0
            git add -A stats; git diff --cached --quiet && break
            git commit -q -m "stats: update" && git push -q origin HEAD:main && { echo PUBLISHED; break; }
            sleep 8
          done
