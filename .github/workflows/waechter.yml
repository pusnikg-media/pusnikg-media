# Wächter: vergleicht Geplantes mit dem, was live ist, prüft die Actions und die Kampagnen-Einreichung (0 Credits).
# Ergebnis: stats/alerts.md (nur offene Probleme) + GitHub-Issue mit Label "alarm" pro Problemgruppe (kein Duplikat, schließt sich selbst).
# Auf main (Zeitplan, von Hand, Push) = echt. Auf anderen Branches = Trockenlauf (nur ins Log, keine Datei, keine Issues).
# Zeiten (UTC): 05:47 vor dem Produzenten (07:47 Berlin), 11:37 nach stats/kampagnen und vor dem Clipping-Agenten (12:47 Berlin), 19:47 nach dem Abend-Stats-Lauf (19:17).
name: waechter
on:
  push:
    paths: ["waechter/**", "plan/waechter.json", "plan/eingereicht.json", "plan/postplan.json", ".github/workflows/waechter.yml"]
  schedule:
    - cron: "47 5 * * *"
    - cron: "37 11 * * *"
    - cron: "47 19 * * *"          # 20:47 Berlin: nach dem 18:00-Short und dem 19:17-Stats-Lauf (Tages-Short/Slots am selben Abend beurteilen)
  workflow_run:                    # GitHub delays crons by 50-90 min (measured 13.-16.11.): judge right after every stats run, not only at the cron times
    workflows: [stats]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: waechter
  cancel-in-progress: false
jobs:
  waechter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /plan/
            /jobs/
            /clipjobs/
            /shorts/*.json
            /clips/*/result.json
            /stats/latest.json
            /stats/alerts.md
            /trends/latest.json
            /campaigns/latest.json
            /waechter/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wächter
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            python3 waechter/waechter.py --root . --dry; exit 0
          fi
          git config user.name "Pusnik G Bot"; git config user.email "bot@users.noreply.github.com"
          # Haken aus den Einreich-Issues -> plan/eingereicht.json (heilt einen verlorenen Push der Aktion 'einreichen'); Fehler hier stoppen den Wächter nicht
          python3 waechter/einreichen.py --root . --mode sync || echo "einreichen sync fehlgeschlagen"
          python3 waechter/waechter.py --root .   # Fehler (z. B. Issues) lassen den Lauf rot enden
          cp stats/alerts.md /home/runner/alerts.md; cp plan/eingereicht.json /home/runner/eingereicht.json
          for i in 1 2 3 4 5; do   # auf den neuesten main legen (viele Actions pushen)
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main || { sleep 5; continue; }
            mkdir -p stats && cp /home/runner/alerts.md stats/alerts.md
            python3 - <<'PY'
          import json
          mine = json.load(open("/home/runner/eingereicht.json")); cur = json.load(open("plan/eingereicht.json"))
          if any(set(mine.get(k, [])) - set(cur.get(k, [])) for k in ("slots", "posts")):   # nur hinzufügen
              for k in ("slots", "posts"): cur[k] = sorted(set(cur.get(k, [])) | set(mine.get(k, [])))
              json.dump(cur, open("plan/eingereicht.json", "w"), ensure_ascii=False, indent=1); open("plan/eingereicht.json", "a").write("\n")
          PY
            git add stats/alerts.md plan/eingereicht.json; git diff --cached --quiet && { echo "alerts.md unveraendert"; break; }
            git commit -q -m "waechter: alerts" && git push -q origin HEAD:main && { echo PUBLISHED; break; }
            echo "push retry $i"; sleep 8
          done
